name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write   

defaults:
  run:
    shell: pwsh

jobs:
  deploy:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./FitFileOverlay

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0      
        
    - name: Get Version from Project File
      id: get-version
      shell: bash
      run: echo "version=$(grep -oE '<Version>[^<]+' FitFileOverlay.csproj | sed 's/<Version>//')" >> $GITHUB_OUTPUT

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.x

    - name: Publish Selfcontained
      run: dotnet publish -c Release --self-contained -r win-x64 -o .\publish-win-x64

    - name: Dotnet Clean
      run: dotnet clean

    - name: Publish .NET10
      run: dotnet publish -c Release --no-self-contained -r win-x64 -o .\publish-win-x64-net10

    - name: Create Velopack Release
      run: |
        dotnet tool install -g vpk
        vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        vpk pack --channel win-x64 -u FitFileOverlay -v ${{ steps.get-version.outputs.version }} -p .\publish-win-x64 --packTitle "Fit Overlay" --mainExe FitFileOverlay.exe
        vpk pack --channel win-x64-net10 --framework net10.0-x64-desktop -u FitFileOverlay -v ${{ steps.get-version.outputs.version }} -p .\publish-win-x64-net10 --packTitle "Fit Overlay" --mainExe FitFileOverlay.exe
        vpk upload github --repoUrl https://github.com/${{ github.repository }} --channel win-x64 --releaseName "Fit Overlay ${{ steps.get-version.outputs.version }}" --tag ${{ steps.get-version.outputs.version }} --token ${{ secrets.GITHUB_TOKEN }}
        vpk upload github --repoUrl https://github.com/${{ github.repository }} --channel win-x64-net10 --merge --publish --releaseName "Fit Overlay ${{ steps.get-version.outputs.version }}" --tag ${{ steps.get-version.outputs.version }} --token ${{ secrets.GITHUB_TOKEN }}
