name: Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write   

defaults:
  run:
    shell: pwsh

jobs:
  deploy:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ./FitFileOverlay

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0      
        
    - name: Get Version from Project File
      id: get-version
      shell: bash
      run: echo "version=$(grep -oE '<Version>[^<]+' FitFileOverlay.csproj | sed 's/<Version>//')" >> $GITHUB_OUTPUT

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 11.x

    - name: Publish
      run: dotnet publish -c Release --no-self-contained -r win-x64 -o .\publish

    - name: Create Release Notes
      uses: softprops/action-gh-release@v3
      with:
        name: "Fit Overlay ${{ steps.get-version.outputs.version }}"
        tag_name: "v${{ steps.get-version.outputs.version }}"
        generate_release_notes: true
        draft: true

    - name: Create Velopack Release
      run: |
        dotnet tool install -g vpk
        vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --channel win-x64
        vpk pack --channel win-x64 --framework net11.0-x64-desktop -u FitFileOverlay -v ${{ steps.get-version.outputs.version }} -p .\publish --packTitle "Fit Overlay" --mainExe FitFileOverlay.exe
        vpk upload github --repoUrl https://github.com/${{ github.repository }} --channel win-x64 --merge --publish --releaseName "Fit Overlay ${{ steps.get-version.outputs.version }}" --tag v${{ steps.get-version.outputs.version }} --token ${{ secrets.GITHUB_TOKEN }}
